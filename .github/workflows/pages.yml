# Lot v0.1 — publie le site sur GitHub Pages depuis « git archive » du commit poussé :
# ce que sert Pages est l'archive du commit, à l'octet (banc/ et .github/ n'y entrent pas).
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Déballer git archive dans _site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
