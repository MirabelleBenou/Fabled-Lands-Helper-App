<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 108" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
<!-- Lot v0.11 — les vignettes des rubriques de la fiche, au trait de plume. Une vue par vignette, 48 × 48, dans des cases
     séparées de 12 unités, sur deux rangs : aucune vue ne touche sa voisine. Masques : seule l'opacité compte. -->
<view id="statistiques" viewBox="0 0 48 48"/>
<view id="possessions" viewBox="60 0 48 48"/>
<view id="cultes" viewBox="120 0 48 48"/>
<view id="aventure" viewBox="180 0 48 48"/>
<view id="combats" viewBox="0 60 48 48"/>
<view id="codes" viewBox="60 60 48 48"/>
<view id="biens" viewBox="120 60 48 48"/>

<!-- Statistiques : l'écu du personnage, chevronné. -->
<g stroke-width="1.4">
  <path d="M10 7H38V21C38 32 31.5 39.5 24 43.5C16.5 39.5 10 32 10 21Z"/>
  <path d="M13.2 10.2H34.8V21C34.8 30.2 29.6 36.6 24 39.9C18.4 36.6 13.2 30.2 13.2 21Z" stroke-width=".7"/>
  <path d="M14.5 28L24 20L33.5 28" stroke-width="1.6"/>
  <path d="M17.5 32.5L24 27L30.5 32.5" stroke-width=".9"/>
  <path d="M24 12.4L25.1 14.8L27.7 15.1L25.8 16.8L26.3 19.4L24 18.1L21.7 19.4L22.2 16.8L20.3 15.1L22.9 14.8Z" fill="#000" stroke-width=".4"/>
</g>

<!-- Possessions : la besace, sa sangle, son rabat cousu. -->
<g transform="translate(60 0)" stroke-width="1.4">
  <path d="M13 19C12.5 9 35.5 9 35 19" stroke-width="1.6"/>
  <path d="M10 20C9.6 30 10 37 13 40.5H35C38 37 38.4 30 38 20"/>
  <path d="M8.5 19.5H39.5L36.5 30C30 33.5 18 33.5 11.5 30Z"/>
  <path d="M11.5 22H36.5" stroke-width=".6" stroke-dasharray="1.4 1.6"/>
  <rect x="21" y="28" width="6" height="5.5" rx=".8" stroke-width="1.1"/>
  <path d="M24 30.2V31.6" stroke-width="1"/>
  <path d="M13 34.5V39M17 35.5V40M31 35.5V40M35 34.5V39" stroke-width=".6"/>
</g>

<!-- Cultes : la flamme sur l'autel. -->
<g transform="translate(120 0)" stroke-width="1.4">
  <path d="M24 5C29.5 11.5 31.8 17.5 28.5 23C26.8 25.8 21.2 25.8 19.5 23C16.2 17.5 18.5 11.5 24 5Z"/>
  <path d="M24 13C26.2 16.4 26.7 19.6 25.2 22C24.6 23 23.4 23 22.8 22C21.3 19.6 21.8 16.4 24 13Z" fill="#000" stroke-width=".6"/>
  <path d="M8.5 27.5H39.5V31H8.5Z"/>
  <path d="M12 31V41.5H36V31"/>
  <path d="M10 41.5H38" stroke-width="1.6"/>
  <path d="M16 33.5V39.5M20 33.5V39.5M24 33.5V39.5M28 33.5V39.5M32 33.5V39.5" stroke-width=".6"/>
  <path d="M14.5 21.5L11.5 19M33.5 21.5L36.5 19" stroke-width=".8"/>
</g>

<!-- Aventure : la rose des vents. -->
<g transform="translate(180 0)">
  <circle cx="24" cy="24" r="15.5" stroke-width=".7"/>
  <circle cx="24" cy="24" r="13" stroke-width=".5" stroke-dasharray=".8 1.6"/>
  <path d="M24 13L26 22L35 24L26 26L24 35L22 26L13 24L22 22Z" transform="rotate(45 24 24)" stroke-width=".7"/>
  <path d="M24 3L26.8 21.2L45 24L26.8 26.8L24 45L21.2 26.8L3 24L21.2 21.2Z" stroke-width="1.1"/>
  <path d="M24 3L26.8 21.2L24 24ZM45 24L26.8 26.8L24 24ZM24 45L21.2 26.8L24 24ZM3 24L21.2 21.2L24 24Z" fill="#000" stroke-width=".5"/>
  <circle cx="24" cy="24" r="1.3" fill="#000" stroke="none"/>
</g>

<!-- Combats : deux épées croisées. -->
<g transform="translate(0 60)">
  <defs>
    <g id="epee" stroke-width="1.2">
      <path d="M24 3.5L26.2 7.5V30H21.8V7.5Z"/>
      <path d="M24 7.5V29" stroke-width=".5"/>
      <path d="M16.5 30.5H31.5" stroke-width="2"/>
      <path d="M24 31.5V38.5" stroke-width="2.6"/>
      <circle cx="24" cy="41" r="2" fill="#000" stroke-width=".6"/>
    </g>
  </defs>
  <use href="#epee" transform="rotate(42 24 24)"/>
  <use href="#epee" transform="rotate(-42 24 24)"/>
</g>

<!-- Codes : la clé. -->
<g transform="translate(60 60) rotate(-35 24 24)" stroke-width="1.4">
  <circle cx="12.5" cy="24" r="7.5"/>
  <circle cx="12.5" cy="24" r="3.6" stroke-width=".8"/>
  <path d="M8.2 17.9L12.5 13.6L16.8 17.9" stroke-width=".6"/>
  <path d="M20 22.3H43.5V25.7H20Z"/>
  <path d="M36 25.7V32.5H39.5V25.7M41.2 25.7V30.5H43.5V25.7" stroke-width="1.1"/>
  <path d="M22.5 20V28M25.5 20.8V27.2" stroke-width=".9"/>
</g>

<!-- Biens : la bourse nouée, et deux pièces. -->
<g transform="translate(120 60)" stroke-width="1.4">
  <path d="M16.5 17C7.5 24 8 41 22 41C35 41 36.5 24 29.5 17Z"/>
  <path d="M16 17.2C20 19.6 26 19.6 30 17.2" stroke-width="1.7"/>
  <path d="M17 16.5L13.5 10.5M20 16L18.8 9M23 16V8.6M26 16L27.4 9M29 16.5L32.5 10.8" stroke-width="1"/>
  <path d="M14.5 27C13.5 31 14.5 35 17 37.5M18 25.5C17.4 29 18 33 19.8 35.5" stroke-width=".6"/>
  <ellipse cx="40.5" cy="40" rx="5.2" ry="3.4" stroke-width="1.2"/>
  <ellipse cx="40.5" cy="40" rx="3" ry="1.8" stroke-width=".6"/>
  <ellipse cx="41.5" cy="31.2" rx="4.6" ry="3" stroke-width="1.2"/>
  <ellipse cx="41.5" cy="31.2" rx="2.6" ry="1.5" stroke-width=".6"/>
</g>
</svg>
