<!doctype html>
<!-- Lot v0.1 — la page : l'en-tête et ses trois onglets, le conteneur des écrans. -->
<html lang="fr" data-theme="jour">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3a2918">
  <title data-i18n="app.nom">Fabled Lands Helper</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Le trait à la plume : appliqué aux seuls cadres (css/app.css), jamais au texte. -->
  <svg class="filtres" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="plume" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="bruit"/>
      <feDisplacementMap in="SourceGraphic" in2="bruit" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="page">
    <header class="entete">
      <p class="marque" data-i18n="app.nom"></p>
      <nav class="onglets">
        <a href="#/" data-test="onglet" data-onglet="accueil" data-i18n="nav.personnages"></a>
        <a href="#/reglages" data-test="onglet" data-onglet="reglages" data-i18n="nav.reglages"></a>
        <a href="#/apropos" data-test="onglet" data-onglet="apropos" data-i18n="nav.apropos"></a>
      </nav>
    </header>
    <main id="ecran"></main>
  </div>
  <!-- Lot v0.2 — le bandeau « nouvelle version prête » : caché jusqu'à ce qu'une version neuve prenne la main (js/app.js). -->
  <div class="bandeau" data-test="bandeau-maj" role="status" hidden>
    <p data-i18n="maj.bandeau"></p>
    <button type="button" class="bouton" data-test="recharger" data-i18n="maj.recharger"></button>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
